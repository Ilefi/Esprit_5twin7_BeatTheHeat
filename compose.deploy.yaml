# Deployment of the published image (CD): app + MySQL.
#   docker compose -f compose.deploy.yaml pull && docker compose -f compose.deploy.yaml up -d
# Reads APP_KEY (required) and the optional variables below from the .env file next to it.
services:
  app:
    image: ${NUTRITRACE_IMAGE:-ghcr.io/ilefi/esprit_5twin7_beattheheat:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env (php artisan key:generate --show)}
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nutritrace
      DB_USERNAME: nutritrace
      DB_PASSWORD: ${DEPLOY_DB_PASSWORD:-nutritrace}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nutritrace
      MYSQL_USER: nutritrace
      MYSQL_PASSWORD: ${DEPLOY_DB_PASSWORD:-nutritrace}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - deploy-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -unutritrace -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  app-storage:
  deploy-mysql-data:
